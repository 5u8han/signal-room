<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="../theme-boot.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#9dbbff"><title>08 / Word Weather — Sub Motion Atlas</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="core.css"><link rel="stylesheet" href="08-word-weather.css"><script type="module" src="08-word-weather.js"></script><link rel="stylesheet" href="../tech-reels.css"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../studio.css"></head><body data-study="08"><header id="atlas-header"></header><main id="main" class="weather-main"><section class="weather-scene"><canvas id="weather-canvas" role="img" aria-label="An abstract typographic atmosphere. Words float across a blue sky and respond to wind and pointer attraction."></canvas><div class="weather-top"><div><span>08 / A CHANGE IN THE AIR.</span><h1>A forecast<br>you can feel.</h1></div><div class="weather-report"><span>CONDITION / WORDS IN MOTION</span><span>PRESS THE FIELD TO GATHER THEM.</span><b id="weather-direction">WIND → 24</b></div></div><div class="weather-controls"><label>YOUR ATMOSPHERE<input id="weather-words" value="SLOW, FAST, SOFT, LOUD, AIR" maxlength="90" autocomplete="off"></label><label>WIND <output id="weather-wind-value">24</output><input id="weather-wind" type="range" min="-100" max="100" value="24"></label><button id="weather-gather" type="button">HOLD TO GATHER <span aria-hidden="true">↘</span></button><button id="weather-change" type="button" aria-label="Generate another word forecast">↻</button></div><p class="weather-footer">DIFFERENT WORDS. DIFFERENT WEIGHT. THE SAME OPEN SKY.</p></section></main><footer id="atlas-footer"></footer></body></html>
