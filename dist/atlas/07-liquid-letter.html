-serif" font-weight="700" font-size="570" textLength="1100" lengthAdjust="spacingAndGlyphs" fill="#171117" filter="url(#liquid-noise)">FLOW</text><text id="liquid-pattern-word" x="50" y="555" font-family="Display, sans-serif" font-weight="700" font-size="570" textLength="1100" lengthAdjust="spacingAndGlyphs" fill="url(#liquid-lines)" opacity=".7" filter="url(#liquid-noise)" aria-hidden="true">FLOW</text><g id="liquid-ripples" fill="none" stroke="#fff4dd" stroke-width="2"></g><circle id="liquid-pointer" cx="600" cy="350" r="7" fill="#fff4dd"/></svg><div class="liquid-controls"><label>INK YOUR OWN WORD<input id="liquid-input" maxlength="8" value="FLOW" autocomplete="off"></label><label>VISCOSITY <output id="liquid-value">36</output><input id="liquid-viscosity" type="range" min="0" max="100" value="36"></label><button id="liquid-drop">MAKE A RIPPLE <span aria-hidden="true">◎</span></button></div><div class="liquid-bottom"><span>MOVE TO DISTURB THE SURFACE.</span><span>AN EDITABLE TYPOGRAPHIC SPECIMEN.</span></div></section></main><footer id="atlas-footer"></footer></body></html>
